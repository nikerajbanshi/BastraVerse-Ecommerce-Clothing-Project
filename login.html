<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#3b82f6",
              secondary: "#1e40af",
            },
            rotate: {
              360: "360deg",
            },
            transitionDuration: {
              2000: "2000ms", // 2 seconds
            },
          },
        },
      };
    </script>
    <style>
      @layer utilities {
        .text-shadow {
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.35);
        }
        .text-shadow-md {
          text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.45);
        }
        .text-shadow-lg {
          text-shadow: 4px 4px 5px rgba(0, 0, 0, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <section
      class="y-12 bg-gradient-to-r from-sky-400 to-sky-900 max-w-screen h-screen flex items-center"
    >
      <div class="container mx-auto px-3 rounded-lg max-w-md">
        <div
          class="flex items-center justify-center bg-gray-300 py-8 rounded-l-2xl"
        >
          <h1 class="font-bold text-gray-700 text-2xl">BastraVerse</h1>
        </div>
        <div
          class="shadow-2xl my-4 p-12 rounded-r-2xl transition-transform tran transitionDuration-300 hover:-translate-y-2"
        >
          <h1
            class="text-shadow-lg flex items-center justify-center text-3xl mb-8 text-white font-semibold"
          >
            Login
          </h1>
          <div class="flex flex-col gap-4 items-center justify-center">
            <div class="flex flex-col gap-2">
              <label
                for="username"
                class="text-xl text-white font-semibold py-2 px-2"
                >Username or Email</label
              >
              <div class="flex gap-2">
                <i class="fas fa-user text-2xl font-bold text-secondary"></i
                ><input
                  type="text"
                  name="username"
                  class="rounded-lg p-2 focus:outline-none"
                />
              </div>
            </div>
            <div class="flex flex-col gap-2">
              <label
                for="passwords"
                class="text-xl text-white font-semibold py-2 px-2"
                >Passwords</label
              >
              <div class="flex gap-2">
                <i class="fas fa-lock text-2xl font-bold text-secondary"></i
                ><input
                  type="password"
                  name="passwords"
                  class="rounded-lg p-2 focus:outline-none"
                />
              </div>
            </div>
            <div class="flex flex-col gap-2 mt-6">
              <button
                class="text-lg bg-green-600 text-white py-2 px-4 flex items-center rounded-lg font-semibold hover:bg-primary"
              >
                Submit
              </button>
            </div>
            <div class="flex mt-4 font-semibold">
              <p class="text-white">Don't have an account ?</p>
              <a
                href=""
                class="italic text-red-900 ml-2 text-ul text-i underline hover:no-underline"
              >
                Register here</a
              >
            </div>
          </div>
        </div>
        <button
          class="flex items-center gap-2 justify-center bg-gray-300 py-8  hover:bg-gray-400 rounded-r-2xl w-full "
        >
          <i class="fab fa-google text-xl pt-1 text-red-500"></i>
          <h1 class="font-bold text-gray-800 text-2xl ">Sign up with Google</h1>
        </button>
      </div>
    </section>
  </body>
</html>
